<div class="ekmail-container">
    <!-- Header -->
    <div class="ekmail-header">
        <div class="ekmail-logo">
            <i class="fas fa-envelope"></i>
            <h2>EKmail</h2>
        </div>
        <div class="ekmail-search">
            <input type="text" placeholder="Search emails..." id="ekmailSearch">
            <button><i class="fas fa-search"></i></button>
        </div>
        <div class="ekmail-user">
            <span id="ekmailUsername">user@ekmail.com</span>
            <div class="ekmail-avatar" id="ekmailUserAvatar">U</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="ekmail-main">
        <!-- Sidebar -->
        <div class="ekmail-sidebar">
            <button class="ekmail-compose-btn" id="ekmailComposeBtn">
                <i class="fas fa-plus"></i> Compose
            </button>
            <nav class="ekmail-folders">
                <ul>
                    <li class="active" data-folder="inbox"><i class="fas fa-inbox"></i> Inbox <span class="badge" id="inboxCount">0</span></li>
                    <li data-folder="sent"><i class="fas fa-paper-plane"></i> Sent</li>
                    <li data-folder="drafts"><i class="fas fa-file-alt"></i> Drafts</li>
                    <li data-folder="trash"><i class="fas fa-trash"></i> Trash</li>
                </ul>
            </nav>
        </div>

        <!-- Email List -->
        <div class="ekmail-content">
            <div class="ekmail-toolbar">
                <div class="toolbar-left">
                    <button class="tool-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
                    <button class="tool-btn" id="deleteBtn"><i class="fas fa-trash"></i></button>
                </div>
                <div class="toolbar-right">
                    <span id="folderInfo">Inbox</span>
                </div>
            </div>
            
            <div class="ekmail-list" id="emailList">
                <!-- Emails will load here -->
            </div>
        </div>

        <!-- Email Detail View -->
        <div class="ekmail-detail" id="emailDetailView">
            <div class="detail-header">
                <button class="close-detail" id="closeDetailBtn"><i class="fas fa-times"></i></button>
                <h3 id="detailSubject">Subject</h3>
            </div>
            <div class="detail-sender">
                <div class="sender-avatar" id="detailAvatar">S</div>
                <div class="sender-info">
                    <span id="detailSender">Sender Name</span>
                    <span id="detailEmail">sender@example.com</span>
                    <span id="detailDate">Today, 10:30 AM</span>
                </div>
            </div>
            <div class="detail-body" id="detailBody">
                <!-- Email content will appear here -->
            </div>
            <div class="detail-actions">
                <button class="action-btn" id="replyBtn"><i class="fas fa-reply"></i> Reply</button>
                <button class="action-btn" id="forwardBtn"><i class="fas fa-share"></i> Forward</button>
            </div>
        </div>
    </div>

    <!-- Compose Modal -->
    <div class="ekmail-compose-modal" id="composeModal">
        <div class="compose-header">
            <h3>New Message</h3>
            <button class="close-compose" id="closeComposeBtn"><i class="fas fa-times"></i></button>
        </div>
        <form id="composeForm">
            <div class="compose-field">
                <input type="email" id="composeTo" placeholder="To" required>
            </div>
            <div class="compose-field">
                <input type="text" id="composeSubject" placeholder="Subject">
            </div>
            <textarea id="composeBody" placeholder="Write your message here..."></textarea>
            <div class="compose-actions">
                <button type="submit" class="send-btn">Send</button>
                <button type="button" class="attach-btn"><i class="fas fa-paperclip"></i> Attach</button>
            </div>
        </form>
    </div>
</div>
